[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["logical-fallacy", "cloud_training"]

[tool.ruff.lint]
select = ["F", "I", "W", "UP"]
ignore = ["UP035"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["D"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true

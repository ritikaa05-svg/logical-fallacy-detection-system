# LogiScan Nginx Reverse Proxy Configuration
# Provides SSL termination, rate limiting, and request buffering.

upstream logiscan_backend {
    server logiscan:8000;
    keepalive 32;
}

# Rate limiting zone
limit_req_zone $binary_remote_addr zone=logiscan_api:10m rate=60r/m;

server {
    listen 80;
    server_name localhost logiscan.local;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Maximum request size (matches MAX_FILE_SIZE_MB=20 for document uploads)
    client_max_body_size 20m;

    # Backend API
    location /api/ {
        limit_req zone=logiscan_api burst=20 nodelay;

        proxy_pass http://logiscan_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Timeouts - Increased to 300s for slow CPU inference
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # Buffering
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }

    # Frontend Dashboard
    location / {
        proxy_pass http://logiscan_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Health check (unauthenticated)
    location /health {
        proxy_pass http://logiscan_backend/api/v1/health;
        proxy_http_version 1.1;
    }
}
